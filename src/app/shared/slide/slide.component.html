<!-- Botón de menú (3 puntos) -->
<button mat-icon-button [matMenuTriggerFor]="menu" class="menu-toggle">
  <mat-icon>more_vert</mat-icon>
</button>

<!-- Menú desplegable -->
<mat-menu #menu="matMenu">

  <!-- Perfil -->
  <div class="profile-section" style="padding: 12px; text-align: center;">
    <img src="https://via.placeholder.com/50" alt="David Velázquez" style="border-radius: 50%;" />
    <div style="margin-top: 5px;">David Velázquez</div>
  </div>
  <mat-divider></mat-divider>

  <!-- Opciones de navegación -->
  <button mat-menu-item (click)="user()">
    <mat-icon>group</mat-icon>
    <span>Usuarios</span>
  </button>
  <button mat-menu-item (click)="product()">
    <mat-icon>storefront</mat-icon>
    <span>Productos</span>
  </button>
  <button mat-menu-item (click)="cart()">
    <mat-icon>shopping_cart</mat-icon>
    <span>Carrito</span>
  </button>
  <button mat-menu-item (click)="agenda()">
    <mat-icon>event</mat-icon>
    <span>Agenda</span>
  </button>
  <button mat-menu-item (click)="pointOfSale()">
    <mat-icon>point_of_sale</mat-icon>
    <span>Administración</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="exit()">
    <mat-icon>logout</mat-icon>
    <span>Salir</span>
  </button>
</mat-menu>
