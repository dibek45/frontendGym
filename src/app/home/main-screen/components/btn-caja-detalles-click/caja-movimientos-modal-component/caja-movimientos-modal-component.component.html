<h2 class="titulo-modal">
  <mat-icon style="vertical-align: middle;">account_balance_wallet</mat-icon>
  Movimientos de la caja
</h2>

<div class="movimientos-scroll">
  <div *ngFor="let m of data.movimientos" class="movimiento">
    <div class="izquierda">
      <div class="tipo">{{ m.tipo | titlecase }}</div>

      <div class="descripcion">{{ m.descripcion || '...' }}</div>
    </div>
    <div class="derecha">


     <div class="monto"
     [ngClass]="{
       'positivo': m.tipo === 'venta' || m.tipo === 'ingreso',
       'negativo': m.tipo === 'gasto' || m.tipo === 'retiro'
     }">
  {{ (m.tipo === 'gasto' || m.tipo === 'retiro') ? '-' : '+' }}
  {{ m.amount | currency:'MXN':'symbol':'1.2-2' }}
</div>


<div class="fecha">
  {{ m.fecha | date:'d MMM y, h:mm a':'':'es-MX' }}
</div>

    </div>
  </div>
</div>

<div class="acciones">
<button mat-button (click)="dialogRef.close()">Cerrar</button>
</div>
