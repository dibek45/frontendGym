<div class="back-button-container" >
  <button mat-button color="primary" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon>
    Regresar
  </button>
</div>
<div class="search-div">
  <div class="search-container">
    <button mat-raised-button (click)="onCreate()" class="btn-create">
      <mat-icon>add</mat-icon>Create
    </button>

    <div class="filter-textarea">
      <mat-icon class="search-icon" style="    z-index: 100;
    color: black;">search</mat-icon>
      <textarea
        autocomplete="off"
        (keyup)="applyFilter($event)"
        class="search-textarea"
      ></textarea>
    </div>
  </div>

  <mat-button-toggle-group name="viewMode" [(ngModel)]="selectedView" class="vista">
    <mat-button-toggle value="table"><mat-icon>grid_view</mat-icon></mat-button-toggle>
    <mat-button-toggle value="card"><mat-icon>view_module</mat-icon></mat-button-toggle>
  </mat-button-toggle-group>

  <div *ngIf="selectedView === 'table'" class="view-wrapper">
    <app-table-material
      [data]="products"
      (elementSelected)="addToCart($event)"
    ></app-table-material>
  </div>

  <div *ngIf="selectedView === 'card'" class="view-wrapper">
    <div *ngFor="let product of products" class="card-item">
      <app-card-product [element]="product"></app-card-product>
    </div>
  </div>
</div>
