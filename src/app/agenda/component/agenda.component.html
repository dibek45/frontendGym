<!-- Ruta seleccionada y botón de regresar -->
<div class="ruta-y-volver" *ngIf="filtroActivo">
  <span class="ruta">/{{ filtroActivo }}</span>
  <button mat-button color="primary" (click)="resetFiltros()">Regresar</button>
</div>

<!-- Cuadros principales (solo si no hay filtro activo) -->
<div class="botones-grid" *ngIf="!filtroActivo">
  <div class="boton-card" (click)="seleccionarFiltro('Clases')">
    <mat-icon class="icono">fitness_center</mat-icon>
    <span>Clases</span>
  </div>
  <div class="boton-card" (click)="seleccionarFiltro('Citas')">
    <mat-icon class="icono">event</mat-icon>
    <span>Citas</span>
  </div>
  <div class="boton-card" (click)="seleccionarFiltro('Entrenadores')">
    <mat-icon class="icono">groups</mat-icon>
    <span>Entrenadores</span>
  </div>
  <div class="boton-card" (click)="seleccionarFiltro('Otros')">
    <mat-icon class="icono">category</mat-icon>
    <span>Otros</span>
  </div>
</div>

<!-- Subfiltros -->
<div class="subfiltros" *ngIf="filtroActivo">
  <button
    mat-stroked-button
    *ngFor="let sub of obtenerSubfiltros()"
    [class.sub-activo]="claseActiva === sub"
    (click)="seleccionarClase(sub)"
  >
    {{ sub }}
  </button>
</div>

<!-- Mostrar solo si hay subfiltro -->
<div *ngIf="claseActiva" class="agenda-container">
  <!-- Calendario reducido -->
  <div class="calendar-wrapper">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>

  <!-- Lista de eventos -->
  <div *ngIf="eventosFiltrados.length > 0" class="eventos-lista">
    <div *ngFor="let evento of eventosFiltrados" class="evento-item">
      <p class="titulo">{{ evento.title }}</p>
      <p class="hora">{{ evento.start | date: 'shortTime' }} - {{ evento.end | date: 'shortTime' }}</p>
      <p class="instructor" *ngIf="evento.instructor">
        <mat-icon>person</mat-icon> {{ evento.instructor }}
      </p>
    </div>
  </div>

  <p *ngIf="eventosFiltrados.length === 0" class="sin-eventos">
    No hay eventos disponibles.
  </p>
</div>
