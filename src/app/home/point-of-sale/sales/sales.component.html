<!-- 🔵 Buscador y Botón Crear Venta -->
<app-ctn-create-search *ngIf="showActivityList"
  (searchChanged)="onSearch($event)"
  (createClicked)="onCreateClick()">
</app-ctn-create-search>

<!-- 🔵 Filtros de fechas, caja, cajero -->
<div class="filters-container" *ngIf="showActivityList">

  <!-- Desde (Fecha inicial) -->
  <mat-form-field appearance="outline">
    <mat-label>Desde</mat-label>
    <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate" (dateChange)="onStartDateChange($event)">
    <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
    <mat-datepicker #startPicker></mat-datepicker>
  </mat-form-field>

  <!-- Hasta (Fecha final) -->
  <mat-form-field appearance="outline">
    <mat-label>Hasta</mat-label>
    <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate" (dateChange)="onEndDateChange($event)">
    <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
    <mat-datepicker #endPicker></mat-datepicker>
  </mat-form-field>

  <!-- Caja Registradora -->
  <mat-form-field appearance="outline">
    <mat-label>Caja Registradora</mat-label>
    <mat-select [(ngModel)]="selectedCashRegisterId" (selectionChange)="onCashRegisterChange($event)">
      <mat-option [value]="null">Todas</mat-option>
      <mat-option *ngFor="let register of cashRegisters" [value]="register.id">
        {{ register.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Cajero -->
  <mat-form-field appearance="outline">
    <mat-label>Cajero</mat-label>
    <mat-select [(ngModel)]="selectedCashierId" (selectionChange)="onCashierChange($event)" [disabled]="cashiers.length === 0">
      <mat-option [value]="null">Todos</mat-option>
      <mat-option *ngFor="let cashier of cashiers" [value]="cashier.id">
        {{ cashier.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Botones Limpiar filtros y Generar reporte -->
  <div class="generate-button-container">
    <button mat-button color="warn" (click)="resetFilters()">Limpiar Filtros</button>
    <button mat-raised-button color="primary" (click)="generateReport()">Generar Reporte</button>
  </div>

</div>

<!-- 🔵 Parte principal: Resumen o Lista -->

<!-- Si no se ha clickeado "Ver actividad" -->
<div *ngIf="!showActivityList">
  <app-summary-weekly
    [weekStartDate]="startOfWeek"
    [dataPerDay]="salesSummary"
    title="Ventas Semanales"
    totalLabel="Total Vendido"
    extraLabel="Total de ventas"
    (seeActivity)="handleSeeActivity()">
  </app-summary-weekly>
</div>

<!-- Si ya se clickeó "Ver actividad" -->
<div *ngIf="showActivityList">

  <button mat-button color="accent" (click)="handleBackToSummary()" class="back-button">
    Volver al resumen
  </button>

  <div *ngIf="(sales$ | async)?.length === 0" class="no-sales">
    No hay ventas registradas.
  </div>

  <div *ngIf="(sales$ | async) as sales" >
    <div class="cards-grid">
      <app-sale-card
        *ngFor="let sale of sales"
        [sale]="sale">
      </app-sale-card>
    </div>
  </div>
  
  

</div>
