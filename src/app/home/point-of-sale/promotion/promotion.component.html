<app-ctn-create-search
  (searchChanged)="onSearch($event)"
  (createClicked)="onCreateClick()">
</app-ctn-create-search>

<ng-container *ngIf="promotionTypes$ | async as types">
  <app-horizontal-filter-buttons
    [title]="'Promociones'"
    [items]="types"
    [selectedItem]="selectedType"
    (selectItem)="selectTypeById($event.id)">
  </app-horizontal-filter-buttons>
</ng-container>

<div class="cards-grid">
  <app-promotion-card
    *ngFor="let promo of filteredPromotions"
    [typeId]="selectedType?.id"
    [promotion]="promo">
  </app-promotion-card>
</div>
