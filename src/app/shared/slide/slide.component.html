<!-- Botón de menú (3 puntos) -->
<button mat-icon-button [matMenuTriggerFor]="menu" class="menu-toggle">
  <mat-icon>more_vert</mat-icon>
</button>

<!-- Menú desplegable -->
<mat-menu #menu="matMenu">
  <mat-divider></mat-divider>

  <button mat-menu-item (click)="route('home/main-screen')">
    <mat-icon>home</mat-icon>
    <span>Home</span>
  </button>
  <!-- 🔹 Operaciones principales -->
  <button mat-menu-item (click)="route('home/administration/cash-register')">
    <mat-icon>payments</mat-icon>
    <span>Caja</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/sales')">
    <mat-icon>bar_chart</mat-icon>
    <span>Ventas</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/exponses')">
    <mat-icon>trending_down</mat-icon>
    <span>Gastos</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/MembershipPayment')">
    <mat-icon>credit_card</mat-icon>
    <span>Pagos membresía</span>
  </button>
  <button mat-menu-item (click)="route('home/product/cart')">
    <mat-icon>shopping_cart</mat-icon>
    <span>Carrito</span>
  </button>

  <mat-divider></mat-divider>

  <!-- 🔹 Gestión de personas y rutinas -->
  <button mat-menu-item (click)="route('home/user/table')">
    <mat-icon>group</mat-icon>
    <span>Usuarios</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/roles')">
    <mat-icon>admin_panel_settings</mat-icon>
    <span>Roles y Permisos</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/PermissionSection')">
    <mat-icon>lock</mat-icon>
    <span>Permisos</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/Cajeros')">
    <mat-icon>person_outline</mat-icon>
    <span>Cajeros</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/Routines')">
    <mat-icon>fitness_center</mat-icon>
    <span>Rutinas</span>
  </button>

  <mat-divider></mat-divider>

  <!-- 🔹 Recursos -->
  <button mat-menu-item (click)="route('home/product/table')">
    <mat-icon>storefront</mat-icon>
    <span>Productos</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/Promotions')">
    <mat-icon>local_offer</mat-icon>
    <span>Promociones</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/maquinas')">
    <mat-icon>precision_manufacturing</mat-icon>
    <span>Maquinas</span>
  </button>

  <mat-divider></mat-divider>

  <!-- 🔹 Análisis e informes -->
  <button mat-menu-item (click)="route('home/administration/Reports')">
    <mat-icon>summarize</mat-icon>
    <span>Reportes</span>
  </button>
  <button mat-menu-item (click)="route('home/administration/Graphs')">
    <mat-icon>insights</mat-icon>
    <span>Gráficas</span>
  </button>

  <mat-divider></mat-divider>

  <!-- Salida -->
  <button mat-menu-item (click)="exit()">
    <mat-icon>logout</mat-icon>
    <span>Salir</span>
  </button>
</mat-menu>
