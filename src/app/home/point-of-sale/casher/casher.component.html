<app-search-create-list
  [data]="data"
  [displayedColumns]="displayedColumns"
  [cardComponent]="cardComponent"
  (create)="openModal()"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)">
</app-search-create-list>
  
<!-- Modal para crear cajero -->
<div class="modal-container" *ngIf="isModalOpen">
  <app-add-casher (closeModal)="handleModalClose($event)"></app-add-casher>
</div>
