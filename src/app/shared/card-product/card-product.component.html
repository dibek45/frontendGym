<div class="card-item">
  <img [src]="element.img" alt="{{ element.name }}" />

  <div class="info">
    <div class="name">{{ element.name }}</div>
    <div class="stock-text">{{ element.stock }} in stock</div>
  </div>

  <div class="meta">
    <div class="price">{{ element.price | number:'1.3-3' }}</div>

    <div class="stock-chip"
         [ngClass]="{
          'stock-green': element.stock > 5,
          'stock-orange': element.stock > 0 && element.stock <= 5,
          'stock-red': element.stock === 0
        }">
      {{ element.stock }} in stock
    </div>

    
  </div>

<!-- Ícono que abre el menú -->
<mat-icon [matMenuTriggerFor]="menu" class="more-icon">more_vert</mat-icon>

<!-- Menú contextual -->
<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="vender(element)">
    <mat-icon>shopping_cart</mat-icon>
    <span>Vender</span>
  </button>

  <button mat-menu-item (click)="editar(element)">
    <mat-icon>edit</mat-icon>
    <span>Editar</span>
  </button>

  <button mat-menu-item (click)="eliminar(element)">
    <mat-icon>delete</mat-icon>
    <span>Eliminar</span>
  </button>
</mat-menu>
</div>
