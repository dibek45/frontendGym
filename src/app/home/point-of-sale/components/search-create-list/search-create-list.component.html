<app-ctn-create-search
  (searchChanged)="onSearch($event)"
  (createClicked)="onCreateClick()">
</app-ctn-create-search>

<div style="text-align: right; margin: 10px;">
  <button mat-button color="primary" (click)="toggleView()">
    <mat-icon>{{ viewMode === 'table' ? 'view_module' : 'table_view' }}</mat-icon>
    {{ viewMode === 'table' ? 'Tarjetas' : 'Tabla' }}
  </button>
</div>

<!-- Vista tabla -->
<div *ngIf="viewMode === 'table'" class="membership-table-wrapper">
  <table mat-table [dataSource]="filteredData" class="mat-elevation-z8">
    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
      <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
      <td mat-cell *matCellDef="let item">{{ item[column] }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let item">
        <button mat-icon-button color="primary" (click)="onEdit(item)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(item)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns.concat('actions')"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns.concat('actions')"></tr>
  </table>
</div>

<!-- Vista tarjetas -->
<div *ngIf="viewMode === 'card'" class="card-list">
    <ng-container *ngIf="viewMode === 'card'">
        <ng-container *ngFor="let item of filteredData">
          <ng-container *ngComponentOutlet="cardComponent; injector: createInjector(item)"></ng-container>
        </ng-container>
      </ng-container>
      
</div>
