<div class="routines-container">
  <!-- Exercise Types Section -->
  <div class="exercise-types card">
    <ng-container *ngIf="exerciseTypes$ | async as types">
      <app-horizontal-filter-buttons
        [title]="'Selecciona tipo de ejercicio'"
        [items]="types"
        [selectedItem]="selectedType"
        (selectItem)="selectType($event)">
      </app-horizontal-filter-buttons>
    </ng-container>

    <div *ngIf="(exerciseTypeError$ | async) as error" class="error">
      <p>Error loading exercise types: {{ error }}</p>
    </div>
  </div>

  <!-- 🔵 Mostrar solo si hay tipo seleccionado -->
  <app-ctn-create-search
    *ngIf="selectedType"
    (searchChanged)="onSearch($event)"
    (createClicked)="onCreateClick()">
  </app-ctn-create-search>

  <!-- Routines Section as Cards -->
  <div class="card routines" *ngIf="selectedType">
    <h3 class="section-subtitle">Routines for {{ selectedType.name }}</h3>

    <ng-container *ngIf="routines$ | async as routines">
      <app-card-routine
        *ngFor="let routine of routines"
        [routine]="routine"
        (edit)="editExercise($event)"
        (delete)="deleteExercise($event)">
      </app-card-routine>
    </ng-container>

    <div *ngIf="(routineError$ | async) as error" class="error">
      <p>Error loading routines: {{ error }}</p>
    </div>

    <button class="btn primary" (click)="addExercise()">Add Routine</button>
  </div>
</div>
