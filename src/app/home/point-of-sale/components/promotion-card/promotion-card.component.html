<div class="promotion-card">
  <div class="promo-header">
    <h3>#{{ promotion.id }}</h3>
    <div class="promo-actions">
      <button class="edit-btn" (click)="onEdit(promotion)">Edit</button>
      <button class="delete-btn" (click)="onDelete(promotion.id)">Delete</button>
    </div>
  </div>

  <div class="promo-body">
    <img
      class="promo-img"
      [src]="imageSrc"
      alt="Promo"
      (error)="handleImageError($event)"
    />
    
    <div class="promo-content">
      <h4 class="promo-title">{{ promotion.name }}</h4>

      <div class="promo-price">
        {{ promotion.price === 0 ? 'Free' : '$' + promotion.price }}
      </div>

      <p class="promo-description">{{ promotion.description }}</p>

      <div class="promo-footer">
        <span class="date-label">
          {{ promotion.startDate | date: 'MMM d' }} – {{ promotion.endDate | date: 'MMM d, y' }}
        </span>
      </div>
    </div>
  </div>
</div>
